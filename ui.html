<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
:root{color-scheme:light;--bg:#f7f8fa;--surface:#fff;--text:#18181b;--muted:#71717a;--border:#e4e4e7;--accent:#5b5bf7;--soft:#eef0ff;--danger:#b91c1c;--success:#15803d}
*{box-sizing:border-box}body{margin:0;font:12px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}
.header{padding:14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(247,248,250,.96);backdrop-filter:blur(10px);z-index:5}
.brand{display:flex;align-items:center;gap:10px}.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#5b5bf7,#10b8ff);color:#fff;display:grid;place-items:center;font-weight:800}.title{font-size:14px;font-weight:700}.sub{color:var(--muted);font-size:11px;margin-top:2px}
.bar{display:flex;align-items:center;justify-content:space-between;margin-top:12px}.page strong{display:block}.count{color:var(--muted);margin-top:2px}.icon{width:30px;height:30px;border:1px solid var(--border);background:#fff;border-radius:8px;cursor:pointer}
.controls{padding:10px 14px;border-bottom:1px solid var(--border)}.search{width:100%;height:34px;border:1px solid var(--border);border-radius:8px;padding:0 10px;outline:none;background:#fff}.search:focus{border-color:#b8bbff;box-shadow:0 0 0 3px var(--soft)}
.chips{display:flex;gap:6px;overflow:auto;margin-top:8px}.chip{border:1px solid var(--border);background:#fff;padding:6px 9px;border-radius:999px;cursor:pointer;white-space:nowrap;color:#52525b}.chip.active{background:var(--soft);border-color:#b8bbff;color:#3730a3}
.content{padding:8px 14px 116px}.group{margin-top:12px}.gt{font-size:10px;font-weight:700;color:#71717a;text-transform:uppercase;letter-spacing:.08em;padding:0 2px 6px}
.card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:7px;cursor:pointer}.card:hover{border-color:#c7c9ff}.meta{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}.tag{color:#4f46e5;background:var(--soft);border-radius:999px;padding:3px 6px;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.idx{color:#a1a1aa}.label{font-weight:600;line-height:1.45;white-space:pre-wrap}.path{color:var(--muted);margin-top:7px;line-height:1.35;word-break:break-word}.props{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}.prop{font-size:10px;color:#52525b;border:1px solid var(--border);background:#fafafa;padding:3px 5px;border-radius:5px}
.empty{text-align:center;color:var(--muted);padding:48px 20px}.empty strong{display:block;color:var(--text);margin-bottom:5px}
.footer{position:fixed;left:0;right:0;bottom:0;padding:10px 14px 12px;background:rgba(247,248,250,.98);border-top:1px solid var(--border)}.row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.btn{height:34px;border:1px solid var(--border);background:#fff;border-radius:8px;cursor:pointer;font-weight:600}.primary{background:#18181b;color:#fff;border-color:#18181b}.endpoint{width:100%;height:30px;border:1px solid var(--border);border-radius:8px;padding:0 8px;margin-top:8px;outline:none}.status{min-height:15px;margin-top:7px;color:var(--muted)}.success{color:var(--success)}.error{color:var(--danger)}a{color:#4f46e5;text-decoration:none;font-weight:600}
</style></head><body>
<header class="header"><div class="brand"><div class="logo">A</div><div><div class="title">AnnotationNav</div><div class="sub">Export native Figma annotations for developer handoff</div></div></div>
<div class="bar"><div class="page"><strong id="pageName">Current page</strong><div class="count" id="count">Scanning…</div></div><button class="icon" id="refresh" title="Refresh">↻</button></div></header>
<section class="controls"><input id="search" class="search" placeholder="Search annotation, screen, node, category…"><div id="chips" class="chips"></div></section>
<main id="content" class="content"></main>
<footer class="footer"><div class="row"><button id="download" class="btn">Export JSON</button><button id="create" class="btn primary">Create Handoff</button></div><input id="endpoint" class="endpoint" placeholder="https://your-app.vercel.app/api/handoffs"><div id="status" class="status"></div></footer>
<script>
var payload=null,active="ALL",query="";
function $(id){return document.getElementById(id)}
function post(type,extra){parent.postMessage({pluginMessage:Object.assign({type:type},extra||{})},"*")}
function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/\x27/g,"&#039;")}
function status(t,c){$("status").className="status "+(c||"");$("status").textContent=t||""}
function categories(){return payload?[...new Set(payload.annotations.map(function(a){return a.categoryLabel}).filter(Boolean))].sort():[]}
function renderChips(){var cats=["ALL"].concat(categories());$("chips").innerHTML=cats.map(function(c){return "<button class=\\"chip "+(active===c?"active":"")+"\" data-cat=\\""+esc(c)+"\\">"+(c==="ALL"?"All":esc(c))+"</button>"}).join("");document.querySelectorAll("[data-cat]").forEach(function(b){b.onclick=function(){active=b.getAttribute("data-cat");render()}})}
function matches(a){var hay=[a.label,a.labelMarkdown,a.nodeName,a.nodePath,a.screenName,a.categoryLabel].concat(a.properties||[]).filter(Boolean).join(" ").toLowerCase();return(!query||hay.indexOf(query.toLowerCase())>=0)&&(active==="ALL"||a.categoryLabel===active)}
function render(){if(!payload)return; $("pageName").textContent=payload.pageName;$("count").textContent=payload.annotations.length+" annotation"+(payload.annotations.length===1?"":"s");renderChips();var visible=payload.annotations.filter(matches);if(!visible.length){$("content").innerHTML="<div class=\\\"empty\\\"><strong>No annotations found</strong><span>Try another search or filter.</span></div>";return}var groups={};visible.forEach(function(a){var k=a.screenName||"Other";(groups[k]||(groups[k]=[])).push(a)});var html="";Object.keys(groups).forEach(function(group){html+="<section class=\\\"group\\\"><div class=\\\"gt\\\">"+esc(group)+" · "+groups[group].length+"</div>";groups[group].forEach(function(a){var p=(a.properties||[]).slice(0,8).map(function(x){return "<span class=\\\"prop\\\">"+esc(x)+"</span>"}).join("");html+="<article class=\\\"card\\\\" data-node=\\\""+esc(a.nodeId)+"\\\"><div class=\\\"meta\\\"><span class=\\\"tag\\\">"+esc(a.categoryLabel||"Annotation")+"</span><span class=\\\"idx\\\">#"+(a.index+1)+"</span></div><div class=\\\"label\\\">"+esc(a.label)+"</div><div class=\\\"path\\\">"+esc(a.nodePath||a.nodeName)+"</div>"+(p?"<div class=\\\"props\\\">"+p+"</div>":"")+"</article>"});html+="</section>"});$("content").innerHTML=html;document.querySelectorAll("[data-node]").forEach(function(card){card.onclick=function(){post("navigate",{nodeId:card.getAttribute("data-node")})}})}
$("search").oninput=function(e){query=e.target.value;render()};
$("refresh").onclick=function(){status("Scanning current page…");post("refresh")};
$("download").onclick=function(){if(!payload)return;var blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download="annotationNav-"+payload.pageName.replace(/[^a-z0-9]+/gi,"-").toLowerCase()+".json";a.click();setTimeout(function(){URL.revokeObjectURL(url)},500);status("JSON exported.","success")};
$("create").onclick=function(){var endpoint=$("endpoint").value.trim();if(!endpoint){status("Enter your Vercel handoff API URL.","error");return}if(!payload){status("No annotation payload yet.","error");return}status("Creating developer handoff…");post("createHandoff",{endpoint:endpoint})};
window.onmessage=function(event){var m=event.data.pluginMessage;if(!m)return;if(m.type==="annotations"){payload=m.payload;active="ALL";query="";$("search").value="";render();status(payload.annotations.length?"":"No native annotations on this page.");}else if(m.type==="endpoint"){$("endpoint").value=m.endpoint||""}else if(m.type==="navigated"){status("Jumped to source node.","success")}else if(m.type==="handoffCreated"){var r=m.result||{};if(r.url){$("status").innerHTML="Handoff created · <a href=\\\""+esc(r.url)+"\\\" target=\\\"_blank\\\">Open developer link</a>"}else status("Handoff created: "+esc(r.id||"ok"),"success")}else if(m.type==="error")status(m.message||"Something went wrong.","error")};
post("getEndpoint");
</script></body></html>
